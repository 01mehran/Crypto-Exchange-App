<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypto Exchange App</title>
    <!-- favicon -->
    <link
      rel="shortcut icon"
      href="./assets/favicon/favicon.png"
      type="image/x-icon"
    />
    <!-- Custom css -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Wrapper -->
    <div class="wrapper">
      <div class="container">
        <!-- Loading -->
        <span class="loading" id="loading"></span>
        <!-- Title -->
        <h1>Crypto Exchange App</h1>
        <!-- Form -->
        <form id="form">
          <!-- Select -->
          <select id="crypto-select"></select>
          <input
            type="number"
            id="token-amount"
            placeholder="Enter your amount"
            required
          />
          <button type="submit" id="add-btn">Add to your portfolio</button>
        </form>
        <h2>Your portfolio :</h2>
        <!-- Portfolio List -->
        <ul id="list"></ul>
      </div>
    </div>

    <!-- JavaScript -->
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
